name: Build NOVA APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare project
        run: |
          if [ -f NOVA_FINAL_FIXED.zip ]; then
            unzip -q NOVA_FINAL_FIXED.zip -d /tmp/nova-src
            PROJECT_DIR=/tmp/nova-src/NOVA_Android_Project
          elif [ -f NOVA_Android_Project/settings.gradle ]; then
            PROJECT_DIR=NOVA_Android_Project
          else
            FILE=$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1)
            test -n "$FILE" || { echo "Gradle project not found"; exit 1; }
            PROJECT_DIR=$(dirname "$FILE")
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building from $PROJECT_DIR"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-Debug-APK
          path: \${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
