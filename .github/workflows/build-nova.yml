name: Build NOVA APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare project
        run: |
          unzip -q NOVA_Android_Studio_Project_FIXED.zip -d /tmp/nova-src
          PROJECT_DIR=/tmp/nova-src/NOVA_v4.0_Complete
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/nova-src/NOVA_v4.0_Complete/app/src/main/assets/index.html")
          s = p.read_text(encoding="utf-8")
          marker = "state = { ...state, ...JSON.parse(localStorage.getItem(settingsKey) || '{}') };\n} catch {}"
          assert marker in s, 'Could not find NOVA settings initialization marker'
          s = s.replace(marker, marker + "\n// Preconfigured NOVA Cloudflare AI backend\nif (!state.backendUrl) state.backendUrl = 'https://nova-ai-brain.hy1009568.workers.dev';", 1)
          p.write_text(s, encoding="utf-8")
          print("Configured NOVA Cloudflare Worker URL in Android WebView asset")
          PY
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building from $PROJECT_DIR"
          curl --fail --silent --show-error https://nova-ai-brain.hy1009568.workers.dev/health

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
