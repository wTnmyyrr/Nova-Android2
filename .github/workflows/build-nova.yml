
name: Build NOVA APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Gradle project and build APK
        run: |
          FILE=$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle not found!"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "Gradle project found at: $DIR"

          cd "$DIR"
          gradle assembleDebug --stacktrace

          APK=$(find . -path '*/build/outputs/apk/debug/*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not generated!"
            exit 1
          fi

          echo "APK_PATH=$DIR/$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-Debug-APK
          path: ${{ env.APK_PATH }}
