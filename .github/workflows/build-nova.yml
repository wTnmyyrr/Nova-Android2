name: Build NOVA APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare project and patch Android voice
        run: |
          unzip -q NOVA_Android_Studio_Project_FIXED.zip -d /tmp/nova-src
          test -f /tmp/nova-src/NOVA_v4.0_Complete/app/src/main/AndroidManifest.xml
          python3 -m py_compile scripts/patch_android_build.py
          python3 scripts/patch_android_build.py
          echo "PROJECT_DIR=/tmp/nova-src/NOVA_v4.0_Complete" >> "$GITHUB_ENV"
          curl --fail --silent --show-error https://nova-ai-brain.hy1009568.workers.dev/health

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
